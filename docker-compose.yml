version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: concurse_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-concurse_db}
      POSTGRES_USER: ${POSTGRES_USER:-concurse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-concurse_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-concurse_user} -d ${POSTGRES_DB:-concurse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: concurse_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
