<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" width="420" height="480" class="cora" data-motion="idle" data-expression="neutral" role="img" aria-labelledby="cora-title cora-description">
<title id="cora-title">Cora, a capivara do Concurse</title>
<desc id="cora-description">Capivara caramelo com focinho creme alongado, duas pequenas mechas, jaqueta violeta e símbolo C branco. Vetor original com cabeça, braços, orelhas e expressões em grupos editáveis.</desc>
<style>
.cora { --ink:#65402e; --fur:#dca66c; --cream:#ffdbab; --violet:#863bff; overflow:visible; }
.cora .outlined { stroke:var(--ink); stroke-width:3.5; stroke-linejoin:round; stroke-linecap:round; }
.cora .detail { fill:none; stroke:var(--ink); stroke-width:3.5; stroke-linecap:round; }
.cora .brow { stroke-width:7; }
.cora .face { display:none; }
.cora[data-expression="neutral"] .face--neutral,
.cora[data-expression="happy"] .face--happy,
.cora[data-expression="thinking"] .face--thinking,
.cora[data-expression="surprised"] .face--surprised,
.cora[data-expression="determined"] .face--determined,
.cora[data-expression="proud"] .face--proud { display:inline; }
.cora .body-motion { transform-origin:210px 408px; }
.cora .head-motion { transform-origin:210px 258px; }
.cora .arm-left { transform-origin:146px 291px; }
.cora .arm-right { transform-origin:274px 291px; }
.cora .ear-left { transform-origin:144px 123px; }
.cora .ear-right { transform-origin:275px 123px; }
.cora .eyes { transform-box:fill-box; transform-origin:center; }
.cora .ground-shadow { transform-origin:210px 422px; }
.cora .sparkle, .cora .confetti { opacity:0; }
.cora[data-motion="idle"] .body-motion { animation:cora-breathe 4.8s ease-in-out infinite; }
.cora[data-motion="idle"] .head-motion { animation:cora-look 9.6s ease-in-out infinite; }
.cora[data-motion="idle"] .eyes { animation:cora-blink 4.8s linear infinite; }
.cora[data-motion="idle"] .arm-right { animation:cora-hand 4.8s ease-in-out infinite; }
.cora[data-motion="correct"] .body-motion { animation:cora-hop 1.6s both; }
.cora[data-motion="correct"] .arm-left { animation:cora-left-accent 1.6s both; }
.cora[data-motion="correct"] .arm-right { animation:cora-right-accent 1.6s both; }
.cora[data-motion="correct"] .head-motion { animation:cora-nod 1.6s both; }
.cora[data-motion="correct"] .ground-shadow { animation:cora-hop-shadow 1.6s both; }
.cora[data-motion="correct"] .sparkle { animation:cora-sparkle 1.6s both; transform-origin:var(--cx) var(--cy); }
.cora[data-motion="celebrate"] .body-motion { animation:cora-party 2.6s both; }
.cora[data-motion="celebrate"] .arm-left { animation:cora-party-left 2.6s both; }
.cora[data-motion="celebrate"] .arm-right { animation:cora-party-right 2.6s both; }
.cora[data-motion="celebrate"] .ear-left { animation:cora-ear 2.6s both; }
.cora[data-motion="celebrate"] .ear-right { animation:cora-ear 2.6s both reverse; }
.cora[data-motion="celebrate"] .ground-shadow { animation:cora-party-shadow 2.6s both; }
.cora[data-motion="celebrate"] .confetti { animation:cora-confetti 2.6s both; }
.cora[data-paused="true"] *, .cora[data-paused="true"] *::before { animation-play-state:paused!important; }
@keyframes cora-breathe { 0%,100%{transform:scale(1,1)} 50%{transform:translateY(-2px) scale(1.008,1.015)} }
@keyframes cora-look { 0%,25%,100%{transform:rotate(0)} 40%,62%{transform:rotate(-2.5deg)} 82%{transform:rotate(1deg)} }
@keyframes cora-blink { 0%,40%,44%,71%,75%,100%{transform:scaleY(1)} 42%,73%{transform:scaleY(.08)} }
@keyframes cora-hand { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-2.5deg)} }
@keyframes cora-hop { 0%,100%{transform:translateY(0) scale(1)} 16%{transform:translateY(3px) scale(1.055,.945)} 38%{transform:translateY(-36px) scale(.97,1.03)} 56%{transform:translateY(-30px)} 73%{transform:translateY(3px) scale(1.045,.965)} 88%{transform:translateY(-3px) scale(1)} }
@keyframes cora-left-accent { 0%,100%{transform:rotate(0)} 17%{transform:rotate(-9deg)} 40%,59%{transform:rotate(31deg)} 80%{transform:rotate(-4deg)} }
@keyframes cora-right-accent { 0%,100%{transform:rotate(0)} 17%{transform:rotate(9deg)} 40%,59%{transform:rotate(-47deg)} 80%{transform:rotate(4deg)} }
@keyframes cora-nod { 0%,100%{transform:rotate(0)} 18%{transform:rotate(4deg)} 43%,57%{transform:rotate(-5deg)} 78%{transform:rotate(2deg)} }
@keyframes cora-hop-shadow { 0%,100%{transform:scale(1);opacity:.14} 38%,56%{transform:scale(.73);opacity:.08} 73%{transform:scale(1.04);opacity:.17} }
@keyframes cora-sparkle { 0%,20%,80%,100%{opacity:0;transform:scale(.3)} 38%,55%{opacity:1;transform:scale(1)} 70%{opacity:0;transform:scale(1.2)} }
@keyframes cora-party { 0%,100%{transform:translateY(0) rotate(0) scale(1)} 10%{transform:scale(1.055,.945)} 26%{transform:translateY(-30px) rotate(-3deg)} 39%{transform:translateY(3px) scale(1.04,.96)} 56%{transform:translateY(-42px) rotate(3deg)} 71%{transform:translateY(3px) scale(1.045,.955)} 85%{transform:translateY(-8px) rotate(-1deg)} }
@keyframes cora-party-left { 0%,100%{transform:rotate(0)} 10%{transform:rotate(-7deg)} 24%,33%{transform:rotate(133deg)} 50%,63%{transform:rotate(119deg)} 77%{transform:rotate(128deg)} 88%{transform:rotate(55deg)} }
@keyframes cora-party-right { 0%,100%{transform:rotate(0)} 10%{transform:rotate(7deg)} 24%,33%{transform:rotate(-128deg)} 50%,63%{transform:rotate(-138deg)} 77%{transform:rotate(-125deg)} 88%{transform:rotate(-55deg)} }
@keyframes cora-ear { 0%,100%{transform:rotate(0)} 28%{transform:rotate(-9deg)} 43%{transform:rotate(5deg)} 58%{transform:rotate(-8deg)} 75%{transform:rotate(4deg)} }
@keyframes cora-party-shadow { 0%,100%{transform:scale(1);opacity:.14} 26%,56%{transform:scale(.72);opacity:.075} 39%,71%{transform:scale(1.04);opacity:.16} }
@keyframes cora-confetti { 0%,9%{opacity:0;transform:translate(0,20px) rotate(0)} 18%{opacity:1} 58%{opacity:1;transform:translate(var(--dx),var(--dy)) rotate(var(--spin))} 88%,100%{opacity:0;transform:translate(var(--end-x),95px) rotate(var(--end-spin))} }
@media (prefers-reduced-motion:reduce) { .cora:not(.motion-opt-in) * { animation:none!important; } }
</style>

