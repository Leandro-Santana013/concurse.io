name: concurseio

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    image: concurseio-app:local
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?configure DATABASE_URL}
      FRONTEND_URL: ${FRONTEND_URL:?configure FRONTEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_CLOCK_SKEW_SECONDS: ${GOOGLE_CLOCK_SKEW_SECONDS:-60}
      SESSION_SECRET: ${SESSION_SECRET:?configure SESSION_SECRET}
      USER_DATA_ENCRYPTION_KEY: ${USER_DATA_ENCRYPTION_KEY:?configure USER_DATA_ENCRYPTION_KEY}
      USER_DATA_ENCRYPTION_KEY_PREVIOUS: ${USER_DATA_ENCRYPTION_KEY_PREVIOUS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:?configure CORS_ORIGINS}
      APP_ADMIN_USER_IDS: ${APP_ADMIN_USER_IDS:-}
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-false}
      PDF_PARSE_CACHE_DIR: /var/lib/concurse/parse-cache
      OCI_OBJECT_STORAGE_NAMESPACE: ${OCI_OBJECT_STORAGE_NAMESPACE:-}
      OCI_OBJECT_STORAGE_BUCKET: ${OCI_OBJECT_STORAGE_BUCKET:-concurseio-media}
      OCI_OBJECT_STORAGE_REGION: ${OCI_OBJECT_STORAGE_REGION:-sa-saopaulo-1}
      OCI_OBJECT_STORAGE_TENANCY: ${OCI_OBJECT_STORAGE_TENANCY:-}
      OCI_OBJECT_STORAGE_USER: ${OCI_OBJECT_STORAGE_USER:-}
      OCI_OBJECT_STORAGE_FINGERPRINT: ${OCI_OBJECT_STORAGE_FINGERPRINT:-}
      OCI_OBJECT_STORAGE_PRIVATE_KEY: ${OCI_OBJECT_STORAGE_PRIVATE_KEY:-}
      OCI_OBJECT_STORAGE_PRIVATE_KEY_FILE: ${OCI_OBJECT_STORAGE_PRIVATE_KEY_FILE:-}
      OCI_OBJECT_STORAGE_PRIVATE_KEY_PASSPHRASE: ${OCI_OBJECT_STORAGE_PRIVATE_KEY_PASSPHRASE:-}
      OCI_OBJECT_STORAGE_QUESTION_PREFIX: ${OCI_OBJECT_STORAGE_QUESTION_PREFIX:-questions}
    volumes:
      - exam_pdfs:/app/pdfs
      - question_images:/app/static/images/questions
      - parser_cache:/var/lib/concurse/parse-cache
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?configure DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  exam_pdfs:
  question_images:
  parser_cache:
  caddy_data:
  caddy_config:
